<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4FF"/>
      <stop offset="100%" style="stop-color:#E8EEF8"/>
    </linearGradient>
    <linearGradient id="g_sensor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2"/>
      <stop offset="100%" style="stop-color:#2C6DB5"/>
    </linearGradient>
    <linearGradient id="g_sync" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B68EE"/>
      <stop offset="100%" style="stop-color:#5A4BD1"/>
    </linearGradient>
    <linearGradient id="g_track" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623"/>
      <stop offset="100%" style="stop-color:#D4820A"/>
    </linearGradient>
    <linearGradient id="g_local" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E05C3A"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
    <linearGradient id="g_loop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3AAE7A"/>
      <stop offset="100%" style="stop-color:#27AE60"/>
    </linearGradient>
    <linearGradient id="g_ros" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB"/>
      <stop offset="100%" style="stop-color:#2980B9"/>
    </linearGradient>
    <linearGradient id="g_calib" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6"/>
      <stop offset="100%" style="stop-color:#7D3C98"/>
    </linearGradient>
    <linearGradient id="g_atlas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#95A5A6"/>
      <stop offset="100%" style="stop-color:#7F8C8D"/>
    </linearGradient>
    <linearGradient id="g_output" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71"/>
      <stop offset="100%" style="stop-color:#27AE60"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555577"/>
    </marker>
    <marker id="arrowhead_calib" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9B59B6"/>
    </marker>
    <marker id="arrowhead_start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#9B59B6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="860" fill="url(#bg)" rx="0"/>

  <!-- ── Title ── -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E" letter-spacing="0.5">AQUA-SLAM  System Architecture</text>
  <text x="550" y="58" text-anchor="middle" font-size="11" fill="#666688" font-style="italic">Tightly-Coupled Acoustic-Visual-Inertial SLAM  ·  IEEE Transactions on Robotics 2025</text>

  <!-- ══════════════════════════════════════════════════════
       1. SENSORS
  ══════════════════════════════════════════════════════ -->
  <!-- Left Camera -->
  <rect x="20" y="74" width="165" height="68" rx="10" fill="url(#g_sensor)" filter="url(#shadow)"/>
  <text x="102" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="white">Left Camera</text>
  <text x="102" y="116" text-anchor="middle" font-size="10" fill="white" opacity="0.85">612×512 px</text>
  <text x="102" y="131" text-anchor="middle" font-size="10" fill="white" opacity="0.85">20 Hz</text>

  <!-- Right Camera -->
  <rect x="200" y="74" width="165" height="68" rx="10" fill="url(#g_sensor)" filter="url(#shadow)"/>
  <text x="282" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="white">Right Camera</text>
  <text x="282" y="116" text-anchor="middle" font-size="10" fill="white" opacity="0.85">612×512 px</text>
  <text x="282" y="131" text-anchor="middle" font-size="10" fill="white" opacity="0.85">20 Hz</text>

  <!-- IMU -->
  <rect x="380" y="74" width="165" height="68" rx="10" fill="url(#g_sensor)" filter="url(#shadow)"/>
  <text x="462" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="white">IMU</text>
  <text x="462" y="116" text-anchor="middle" font-size="10" fill="white" opacity="0.85">gyroscope + accelerometer</text>
  <text x="462" y="131" text-anchor="middle" font-size="10" fill="white" opacity="0.85">200 Hz</text>

  <!-- DVL -->
  <rect x="560" y="74" width="165" height="68" rx="10" fill="url(#g_sensor)" filter="url(#shadow)"/>
  <text x="642" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="white">DVL</text>
  <text x="642" y="116" text-anchor="middle" font-size="10" fill="white" opacity="0.85">body velocity (acoustic)</text>
  <text x="642" y="131" text-anchor="middle" font-size="10" fill="white" opacity="0.85">~5 Hz</text>

  <!-- Arrows: sensors -> sync -->
  <line x1="102" y1="142" x2="102" y2="168" stroke="#555577" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <line x1="282" y1="142" x2="282" y2="168" stroke="#555577" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <line x1="462" y1="142" x2="462" y2="168" stroke="#555577" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <line x1="642" y1="142" x2="520" y2="168" stroke="#555577" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- ══════════════════════════════════════════════════════
       2. SYNCHRONIZER
  ══════════════════════════════════════════════════════ -->
  <rect x="20" y="168" width="730" height="58" rx="10" fill="url(#g_sync)" filter="url(#shadow)"/>
  <text x="385" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="white">Synchronizer  (node.cpp)</text>
  <text x="385" y="213" text-anchor="middle" font-size="10.5" fill="white" opacity="0.88">ImageGrabber  ·  ImuGrabber  ·  DVLGrabber   →   SyncWithImu() thread</text>

  <!-- Arrow: sync -> tracking  with label -->
  <line x1="385" y1="226" x2="385" y2="252" stroke="#555577" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <rect x="395" y="229" width="155" height="18" rx="4" fill="white" opacity="0.78"/>
  <text x="473" y="242" text-anchor="middle" font-size="9.5" fill="#444466">stereo images + IMU/DVL batch</text>

  <!-- ══════════════════════════════════════════════════════
       3. TRACKING
  ══════════════════════════════════════════════════════ -->
  <rect x="20" y="252" width="730" height="120" rx="10" fill="url(#g_track)" filter="url(#shadow)"/>
  <text x="110" y="276" font-size="14" font-weight="700" fill="white">Tracking</text>
  <text x="40" y="298" font-size="10.5" fill="white" opacity="0.93">▸  ORBextractor: 1000 features / image, 8-level scale pyramid (left + right)</text>
  <text x="40" y="316" font-size="10.5" fill="white" opacity="0.93">▸  Stereo matching (epipolar constraint)  →  disparity  →  absolute depth</text>
  <text x="40" y="334" font-size="10.5" fill="white" opacity="0.93">▸  PoseOptimization()  —  visual-only per-frame pose (g2o)</text>
  <text x="40" y="352" font-size="10.5" fill="white" opacity="0.93">▸  New keyframe decision  (tracking quality · elapsed time · motion magnitude)</text>

  <!-- Arrow: tracking -> local  with label -->
  <line x1="385" y1="372" x2="385" y2="398" stroke="#555577" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <rect x="395" y="376" width="72" height="18" rx="4" fill="white" opacity="0.78"/>
  <text x="431" y="389" text-anchor="middle" font-size="9.5" fill="#444466">Keyframe</text>

  <!-- ══════════════════════════════════════════════════════
       4. LOCAL MAPPING
  ══════════════════════════════════════════════════════ -->
  <rect x="20" y="398" width="730" height="138" rx="10" fill="url(#g_local)" filter="url(#shadow)"/>
  <text x="110" y="422" font-size="14" font-weight="700" fill="white">LocalMapping</text>
  <text x="40" y="444" font-size="10.5" fill="white" opacity="0.93">▸  Keyframe culling  (remove redundant keyframes)</text>
  <text x="40" y="462" font-size="10.5" fill="white" opacity="0.93">▸  New MapPoint triangulation from stereo matches</text>

  <!-- Highlighted row -->
  <rect x="30" y="470" width="710" height="22" rx="5" fill="white" opacity="0.15"/>
  <text x="40" y="485" font-size="10.5" font-weight="700" fill="#FFE566">▸  LocalDVLBundleAdjustment()   ◀  Key Contribution</text>

  <text x="40" y="505" font-size="10.5" fill="white" opacity="0.9">     E_total  =  λ_v · E_visual  +  λ_d · E_DVL  +  λ_r · E_rotation</text>
  <text x="40" y="523" font-size="10.5" fill="white" opacity="0.9">     backend: g2o Levenberg-Marquardt  |  optimizes: KF poses, MapPoints, DVL velocity, gyro bias</text>

  <!-- Arrow: local -> loop  with label -->
  <line x1="385" y1="536" x2="385" y2="562" stroke="#555577" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <rect x="395" y="540" width="78" height="18" rx="4" fill="white" opacity="0.78"/>
  <text x="434" y="553" text-anchor="middle" font-size="9.5" fill="#444466">Global map</text>

  <!-- ══════════════════════════════════════════════════════
       ATLAS  (right side, rows 4-5)
  ══════════════════════════════════════════════════════ -->
  <rect x="790" y="408" width="290" height="108" rx="10" fill="url(#g_atlas)" filter="url(#shadow)"/>
  <text x="935" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="white">Atlas</text>
  <text x="935" y="456" text-anchor="middle" font-size="10.5" fill="white" opacity="0.88">Multi-map management</text>
  <text x="935" y="474" text-anchor="middle" font-size="10.5" fill="white" opacity="0.88">Active / inactive sub-map switching</text>
  <text x="935" y="492" text-anchor="middle" font-size="10.5" fill="white" opacity="0.88">Boost serialization (map save / load)</text>
  <text x="935" y="510" text-anchor="middle" font-size="10.5" fill="white" opacity="0.88">Sub-map merging on loop closure</text>

  <!-- Double arrow: LocalMapping <-> Atlas -->
  <line x1="750" y1="458" x2="790" y2="458" stroke="#95A5A6" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <line x1="790" y1="472" x2="750" y2="472" stroke="#95A5A6" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <text x="770" y="450" text-anchor="middle" font-size="9" fill="#7F8C8D">Map R/W</text>

  <!-- ══════════════════════════════════════════════════════
       5. LOOP CLOSING
  ══════════════════════════════════════════════════════ -->
  <rect x="20" y="562" width="730" height="118" rx="10" fill="url(#g_loop)" filter="url(#shadow)"/>
  <text x="110" y="586" font-size="14" font-weight="700" fill="white">LoopClosing</text>
  <text x="40" y="608" font-size="10.5" fill="white" opacity="0.93">▸  KeyFrameDatabase  —  DBoW2 bag-of-words similarity search for candidates</text>
  <text x="40" y="626" font-size="10.5" fill="white" opacity="0.93">▸  Sim3Solver  —  7-DoF transform RANSAC geometric verification</text>
  <text x="40" y="644" font-size="10.5" fill="white" opacity="0.93">▸  Atlas::MergeMaps()  —  sub-map fusion when loop spans multiple sub-maps</text>
  <text x="40" y="662" font-size="10.5" fill="white" opacity="0.93">▸  OptimizeEssentialGraph()  —  global pose graph optimization (drift correction)</text>

  <!-- Arrow: loop -> ros  with label -->
  <line x1="385" y1="680" x2="385" y2="706" stroke="#555577" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- ══════════════════════════════════════════════════════
       SENSOR CALIBRATION  (right side, rows 3-5)
  ══════════════════════════════════════════════════════ -->
  <rect x="790" y="252" width="290" height="248" rx="10" fill="url(#g_calib)" filter="url(#shadow)"/>
  <text x="935" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="white">Sensor Calibration</text>
  <rect x="810" y="285" width="250" height="20" rx="4" fill="white" opacity="0.15"/>
  <text x="935" y="299" text-anchor="middle" font-size="10" fill="#FFD580" font-weight="600">Paper only  ·  NOT in released code</text>

  <text x="810" y="325" font-size="11" font-weight="700" fill="white">Extrinsic Calibration  (Sec. V-A)</text>
  <text x="810" y="343" font-size="10" fill="white" opacity="0.88">  T_ID  :  IMU ↔ DVL</text>
  <text x="810" y="359" font-size="10" fill="white" opacity="0.88">  T_DC  :  DVL ↔ Camera</text>
  <text x="810" y="375" font-size="10" fill="white" opacity="0.88">  5-step coarse-to-fine  (Eq. 22)</text>

  <line x1="810" y1="386" x2="1060" y2="386" stroke="white" stroke-width="0.6" opacity="0.3"/>

  <text x="810" y="404" font-size="11" font-weight="700" fill="white">DVL Misalignment Calib.  (Sec. V-B)</text>
  <text x="810" y="422" font-size="10" fill="white" opacity="0.88">  α_n, β_n  (n=1..4, transducer beam angles)</text>
  <text x="810" y="438" font-size="10" fill="white" opacity="0.88">  EdgeDVLBeamCalibration1/2 → dead code</text>
  <text x="810" y="456" font-size="10" fill="white" opacity="0.88">  hardcoded dev path in Optimizer.cc</text>

  <line x1="810" y1="467" x2="1060" y2="467" stroke="white" stroke-width="0.6" opacity="0.3"/>

  <text x="810" y="485" font-size="11" font-weight="700" fill="white">IMU Bias Init.  (implemented ✓)</text>
  <text x="810" y="501" font-size="10" fill="white" opacity="0.88">  /calibrate → InitializeDvlIMU()</text>
  <text x="810" y="517" font-size="10" fill="#FFD580" opacity="0.95">  gyro bias only, not T_ID / T_DC</text>

  <!-- Dashed double arrow: Calib <-> LocalMapping -->
  <line x1="750" y1="390" x2="790" y2="390" stroke="#9B59B6" stroke-width="1.6" stroke-dasharray="5,4"
        marker-start="url(#arrowhead_start)" marker-end="url(#arrowhead_calib)"/>
  <text x="770" y="382" text-anchor="middle" font-size="9" fill="#9B59B6" font-style="italic">inactive</text>

  <!-- ══════════════════════════════════════════════════════
       6. ROS HANDLING
  ══════════════════════════════════════════════════════ -->
  <rect x="20" y="706" width="730" height="112" rx="10" fill="url(#g_ros)" filter="url(#shadow)"/>
  <text x="110" y="730" font-size="14" font-weight="700" fill="white">RosHandling</text>
  <text x="40" y="752" font-size="10.5" fill="white" opacity="0.93">▸  PublishOrb()   →  /orb_pose,  /orb_odom                    (~20 Hz)</text>
  <text x="40" y="770" font-size="10.5" fill="white" opacity="0.93">▸  PublishPath()  →  /orb_path,  /orb_path_body               (~4 Hz, BA-refined)</text>
  <text x="40" y="788" font-size="10.5" fill="white" opacity="0.93">▸  PublishMap()   →  /sparse_map,  /octomap,  /markers         (~4 Hz)</text>
  <text x="40" y="806" font-size="10.5" fill="white" opacity="0.93">▸  TF broadcast   →  frame: aqua_slam → orb_slam  |  mT_w_c0 (gravity-aligned, set once)</text>

  <!-- ══════════════════════════════════════════════════════
       COORDINATE FRAMES NOTE
  ══════════════════════════════════════════════════════ -->
  <rect x="20" y="824" width="730" height="26" rx="6" fill="#1A1A2E" opacity="0.07"/>
  <text x="30" y="841" font-size="9.5" fill="#444466" font-style="italic">
    Coord. frames:  world(W) ← mT_w_c0 ← c0(ORB origin) ← camera(C, RDF)  ←  T_imu_c  ← IMU  ←  T_body_imu  ← body(FLU, ROS REP-103)
  </text>

  <!-- ══════════════════════════════════════════════════════
       LEGEND
  ══════════════════════════════════════════════════════ -->
  <rect x="790" y="572" width="290" height="216" rx="10" fill="white" opacity="0.72" filter="url(#shadow)"/>
  <text x="935" y="596" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A2E">Legend</text>
  <line x1="810" y1="602" x2="1060" y2="602" stroke="#CCCCCC" stroke-width="1"/>

  <!-- Legend items -->
  <rect x="815" y="612" width="18" height="14" rx="3" fill="url(#g_sensor)"/>
  <text x="842" y="623" font-size="10.5" fill="#1A1A2E">Sensor input</text>

  <rect x="815" y="633" width="18" height="14" rx="3" fill="url(#g_sync)"/>
  <text x="842" y="644" font-size="10.5" fill="#1A1A2E">Synchronizer</text>

  <rect x="815" y="654" width="18" height="14" rx="3" fill="url(#g_track)"/>
  <text x="842" y="665" font-size="10.5" fill="#1A1A2E">Tracking  (~20 Hz)</text>

  <rect x="815" y="675" width="18" height="14" rx="3" fill="url(#g_local)"/>
  <text x="842" y="686" font-size="10.5" fill="#1A1A2E">LocalMapping  (keyframe)</text>

  <rect x="815" y="696" width="18" height="14" rx="3" fill="url(#g_loop)"/>
  <text x="842" y="707" font-size="10.5" fill="#1A1A2E">LoopClosing</text>

  <rect x="815" y="717" width="18" height="14" rx="3" fill="url(#g_ros)"/>
  <text x="842" y="728" font-size="10.5" fill="#1A1A2E">RosHandling</text>

  <rect x="815" y="738" width="18" height="14" rx="3" fill="url(#g_calib)"/>
  <text x="842" y="749" font-size="10.5" fill="#1A1A2E">Calibration  (paper, not in code)</text>

  <rect x="815" y="759" width="18" height="14" rx="3" fill="url(#g_atlas)"/>
  <text x="842" y="770" font-size="10.5" fill="#1A1A2E">Atlas  (multi-map)</text>

  <!-- Legend: dashed line -->
  <line x1="815" y1="789" x2="833" y2="789" stroke="#9B59B6" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="842" y="793" font-size="10.5" fill="#1A1A2E">Inactive / not implemented</text>

</svg>
